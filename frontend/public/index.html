<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#721B29" />
        <meta name="description" content="Sogrape Balanced Scorecard — Strategy execution portal" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <title>Sogrape · Balanced Scorecard</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
          // Suppress benign ResizeObserver dev-overlay noise (Radix/Recharts)
          window.addEventListener("error", function (e) {
            if (e && e.message && (e.message.includes("ResizeObserver loop") || e.message.includes("ResizeObserver loop completed"))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
          window.addEventListener("unhandledrejection", function (e) {
            if (e && e.reason && (e.reason.message || "").includes("ResizeObserver loop")) {
              e.preventDefault();
            }
          });
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
